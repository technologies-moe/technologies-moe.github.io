<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Diorama Tuner — technologies.moe</title>
<style>
:root{
  --pink:#ff3d92;
  --ink:#e9e3ee;
  --panel:#1b1620;
  --panel2:#241d2b;
  --line:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
  background:#100c14; color:var(--ink);
  overflow:hidden;
}

/* ---- stage ---- */
.diorama{
  position:fixed; inset:0 380px 0 0;
  overflow:hidden;
  background:#ded4e6;
  perspective:2000px;
}
.camera{
  position:absolute; left:50%; top:50%;
  width:max(calc(100vw - 380px), 100svh * 1.7768);
  height:max(100svh, calc((100vw - 380px) / 1.7768));
  transform:translate(-50%,-50%);
  transform-style:preserve-3d;
  /* the camera sits on the z=0 plane, so without this it hit-tests IN FRONT of
     every layer with a negative z and swallows their pins */
  pointer-events:none;
}
.layer{position:absolute; inset:0; transform-style:preserve-3d; backface-visibility:hidden}
.layer img{
  position:absolute;
  width:calc(var(--sx,1) * 100%);
  height:calc(var(--sy,1) * 100%);
  left:calc((50 + var(--tx,0) - var(--sx,1) * 50) * 1%);
  top:calc((50 + var(--ty,0) - var(--sy,1) * 50) * 1%);
  object-fit:fill; display:block; -webkit-user-drag:none;
}
.foot-shade{
  position:absolute; left:var(--fx); top:var(--fy);
  width:var(--fw); height:var(--fh);
  transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(62,38,82,.42), rgba(62,38,82,.16) 55%, transparent 78%);
}
.hotspot{position:absolute; transform:translate(-50%,-50%) scale(var(--cs,1))}
.hotspot-dot{
  display:flex;align-items:center;gap:.4rem;
  padding:5px 11px 5px 7px;border:0;border-radius:999px;
  background:rgba(44,28,54,.8);color:#fff;font:inherit;
  white-space:nowrap;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;
}
.hotspot-dot .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);flex:none}
.hotspot-dot .cap{font-size:10px;font-weight:800;letter-spacing:.08em}
.speech{position:absolute;transform:translate(-50%,-50%) scale(var(--cs,1))}
.speech-body{
  font:inherit;font-size:11px;font-weight:600;max-width:14rem;
  background:rgba(255,255,255,.94);color:#2b2233;
  border:0;border-radius:12px 12px 12px 3px;padding:.5rem .7rem;
}
.speech-body::after{content:"（吹き出し）"}
.hotspot.is-hidden .hotspot-dot{
  background:rgba(255,61,146,.18);
  box-shadow:0 0 0 1px rgba(255,61,146,.5);
  width:44px;height:44px;border-radius:12px;
}
.hotspot.is-hidden .hotspot-dot .dot{background:transparent}
.layer.dim{opacity:.18}
.layer.hide{display:none}
.layer.solo-off{display:none}
.layer.state-off{display:none}

/* ---- floor guides ---- */
#guides{position:absolute;inset:0;pointer-events:none;z-index:70}
#guides .gl{
  position:absolute;left:0;right:0;height:0;
  border-top:1px dashed rgba(255,61,146,.75);
}
#guides .gl b{
  position:absolute;left:6px;top:-16px;
  font-size:10px;font-weight:800;color:#ff8ec0;
  background:rgba(20,12,26,.7);padding:1px 5px;border-radius:4px;
}
#guides .gl.seat{border-top-style:solid;border-top-color:rgba(79,201,189,.9)}
#guides .gl.seat b{color:#8ff0e6}
#guides.off{display:none}

/* ---- panel ---- */
.panel{
  position:fixed;top:0;right:0;bottom:0;width:380px;
  background:var(--panel);
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  font-size:13px;
}
.phead{
  padding:.8rem 1rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  background:var(--panel2);
}
.phead h1{font-size:.85rem;font-weight:800;letter-spacing:.06em;margin-right:auto}
.btn{
  font:inherit;font-size:11px;font-weight:700;
  padding:.35rem .7rem;border-radius:6px;border:1px solid var(--line);
  background:#2e2536;color:var(--ink);cursor:pointer;
}
.btn:hover{border-color:var(--pink);color:#fff}
.btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.list{flex:1;overflow-y:auto;padding:.5rem}

.row{
  border:1px solid var(--line);border-radius:8px;
  margin-bottom:.45rem;background:var(--panel2);
  overflow:hidden;
}
.row.sel{border-color:var(--pink)}
.rhead{
  display:flex;align-items:center;gap:.5rem;
  padding:.5rem .6rem;cursor:pointer;
}
.rhead .nm{font-weight:700;flex:1}
.rhead .par{font-size:11px;color:#b9a6d4;font-variant-numeric:tabular-nums}
.rhead .when{
  font-size:9px;font-weight:800;letter-spacing:.1em;
  padding:1px 6px;border-radius:999px;border:1px solid currentColor;
}
.rhead .when.sleep{color:#8ab4ff}
.rhead .when.awake{color:#ffb45e}
.row.hidden-state{opacity:.42}
.eye{
  width:22px;height:22px;border-radius:5px;border:1px solid var(--line);
  background:#3a3044;color:#cfc3d8;font-size:10px;cursor:pointer;line-height:1;
}
.eye.off{opacity:.35}
.body{display:none;padding:.2rem .6rem .7rem;border-top:1px solid var(--line)}
.row.sel .body{display:block}

.f{display:grid;grid-template-columns:2.6rem 1fr 4.2rem;align-items:center;gap:.4rem;margin-top:.4rem}
.f label{font-size:11px;font-weight:700;color:#b9a6d4}
.f input[type=range]{width:100%;accent-color:var(--pink)}
.f input[type=number]{
  width:100%;font:inherit;font-size:11px;
  background:#150f1b;border:1px solid var(--line);border-radius:5px;
  color:var(--ink);padding:.2rem .3rem;text-align:right;
}
.hint{font-size:10.5px;color:#8b7f96;padding:.5rem .3rem 0;line-height:1.5}
.out{
  border-top:1px solid var(--line);background:var(--panel2);
  padding:.7rem 1rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
}
.out .msg{font-size:11px;color:#9d90a9;flex:1}
textarea{
  width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;
  background:#0e0a12;color:#cbbfd6;border:1px solid var(--line);border-radius:6px;
  padding:.5rem;resize:vertical;display:none;
}
textarea.show{display:block}
kbd{
  background:#3a3044;border:1px solid var(--line);border-radius:4px;
  padding:0 4px;font-size:10px;font-family:inherit;
}
</style>
</head>
<body>

<div class="diorama" id="diorama">
  <div class="camera" id="camera"></div>
  <div id="guides"></div>
</div>

<div class="panel">
  <div class="phead">
    <h1>DIORAMA TUNER</h1>
    <button class="btn on" id="freeze">静止</button>
    <button class="btn" id="guideBtn">床ガイド</button>
    <button class="btn" id="dimBtn">選択以外を薄く</button>
    <button class="btn" id="stateBtn" title="when: sleep / awake の出しわけ">状態: 両方</button>
  </div>

  <div class="list" id="list"></div>

  <div class="out">
    <button class="btn" id="copy">JSONをコピー</button>
    <button class="btn" id="show">表示</button>
    <button class="btn" id="reset">読み直す</button>
    <span class="msg" id="msg"></span>
    <textarea id="json" spellcheck="false"></textarea>
  </div>
</div>

<script src="assets/diorama.js"></script>
<script>
(async () => {
  'use strict';
  const root = document.getElementById('diorama');
  const listEl = document.getElementById('list');
  const msg = document.getElementById('msg');
  const KEY = 'diorama-tune';

  const res = await fetch('assets/room/layers.json', { cache: 'no-cache' });
  const fresh = await res.json();
  const freshText = JSON.stringify(fresh);

  /* A snapshot taken before layers.json changed on disk is worse than useless:
     restoring it silently reverts whatever was edited in the file, and the next
     "JSONをコピー" pastes that stale state back over it. So the snapshot records
     the file it was branched from, and is only offered while that still matches. */
  const saved = localStorage.getItem(KEY);
  const base  = localStorage.getItem(KEY + ':base');
  let data = fresh;
  let startupNote = '';
  if (saved) {
    if (base === freshText) {
      data = JSON.parse(saved);
      startupNote = '前回の編集内容を復元しました';
    } else {
      localStorage.removeItem(KEY); localStorage.removeItem(KEY + ':base');
      startupNote = '⚠ layers.json が更新されていたので、保存中の編集内容は破棄しました';
    }
  }

  let recs = Diorama.build(root, data, 'all');   // show sleep + awake props together
  let motion = Diorama.animate(root, recs, data, { frozen: true });
  let sel = null;

  /* ---------- floor guides: horizontal lines at fixed stage percentages ---------- */
  const guides = document.getElementById('guides');
  [55, 62, 70, 78, 86, 94].forEach(p => {
    const g = document.createElement('div');
    g.className = 'gl';
    g.style.top = p + '%';
    g.innerHTML = '<b>' + p + '%</b>';
    guides.appendChild(g);
  });
  /* Where the chair's seat meets its backrest. A prop standing on the seat has
     its REARMOST foot on this line — that is what puts the sleep board on the
     cushion instead of hovering over it. Measured off the chair sheet at its
     placed transform; re-measure if the chair ever moves. */
  {
    const g = document.createElement('div');
    g.className = 'gl seat';
    g.style.top = (833 / 941 * 100).toFixed(2) + '%';
    g.innerHTML = '<b>座と背の接合 — 奥側の足はここ</b>';
    guides.appendChild(g);
  }
  guides.classList.add('off');

  /* ---------- field spec per layer ---------- */
  const FIELDS = [
    ['sx', '横倍率', 0.05, 2, 0.005],
    ['sy', '縦倍率', 0.05, 2, 0.005],
    ['tx', '左右', -60, 60, 0.1],
    ['ty', '上下', -60, 60, 0.1],
    ['par', '視差', 0.05, 2, 0.01]
  ];

  function recFor(id) { return recs.find(r => r.def.id === id && !r.pin); }
  function pinFor(id) { return recs.find(r => r.def.id === id && r.pin); }

  function repaint(def) {
    const P = data.perspective || 2000;
    const r = recFor(def.id); if (r) Diorama.apply(r, def, P);
    const p = pinFor(def.id); if (p) Diorama.apply(p, def, P);
  }

  function buildList() {
    listEl.textContent = '';
    data.layers.forEach((L) => {
      const row = document.createElement('div');
      row.className = 'row' + (sel === L.id ? ' sel' : '');
      row.dataset.id = L.id;

      const head = document.createElement('div');
      head.className = 'rhead';
      head.innerHTML =
        `<button class="eye" title="表示/非表示">👁</button>` +
        `<span class="nm">${L.id}</span>` +
        (L.when ? `<span class="when ${L.when}">${L.when}</span>` : '') +
        `<span class="par">par ${(+L.par).toFixed(2)} / z ${Diorama.zOf(L.par)}</span>`;
      row.appendChild(head);

      const body = document.createElement('div');
      body.className = 'body';
      FIELDS.forEach(([k, lbl, min, max, step]) => {
        const f = document.createElement('div');
        f.className = 'f';
        f.innerHTML =
          `<label>${lbl}</label>` +
          `<input type="range" min="${min}" max="${max}" step="${step}" value="${L[k]}">` +
          `<input type="number" min="${min}" max="${max}" step="${step}" value="${L[k]}">`;
        const [rng, num] = f.querySelectorAll('input');
        const set = (v) => {
          v = Math.min(max, Math.max(min, +v || 0));
          L[k] = Math.round(v * 1000) / 1000;
          rng.value = num.value = L[k];
          if (k === 'par') {
            head.querySelector('.par').textContent =
              `par ${(+L.par).toFixed(2)} / z ${Diorama.zOf(L.par)}`;
          }
          repaint(L); persist();
        };
        rng.addEventListener('input', () => set(rng.value));
        num.addEventListener('input', () => set(num.value));
        body.appendChild(f);
      });

      const allPins = L.pins || (L.pin ? [L.pin] : []);
      allPins.forEach((pin, pi) => {
        const nm = (pin.label || ('ピン' + (pi + 1))).slice(0, 8);
        ['x', 'y'].forEach(k => {
          const f = document.createElement('div');
          f.className = 'f';
          f.innerHTML =
            `<label>${nm}${k === 'x' ? '←→' : '↑↓'}</label>` +
            `<input type="range" min="0" max="100" step="0.5" value="${pin[k]}">` +
            `<input type="number" min="0" max="100" step="0.5" value="${pin[k]}">`;
          const [rng, num] = f.querySelectorAll('input');
          const set = (v) => {
            pin[k] = Math.round((+v || 0) * 10) / 10;
            rng.value = num.value = pin[k];
            repaint(L); persist();
          };
          rng.addEventListener('input', () => set(rng.value));
          num.addEventListener('input', () => set(num.value));
          body.appendChild(f);
        });
      });
      if (L.speech) {
        ['x', 'y'].forEach(k => {
          const f = document.createElement('div');
          f.className = 'f';
          f.innerHTML =
            `<label>吹出${k === 'x' ? '←→' : '↑↓'}</label>` +
            `<input type="range" min="0" max="100" step="0.5" value="${L.speech[k]}">` +
            `<input type="number" min="0" max="100" step="0.5" value="${L.speech[k]}">`;
          const [rng, num] = f.querySelectorAll('input');
          const set = (v) => {
            L.speech[k] = Math.round((+v || 0) * 10) / 10;
            rng.value = num.value = L.speech[k];
            repaint(L); persist();
          };
          rng.addEventListener('input', () => set(rng.value));
          num.addEventListener('input', () => set(num.value));
          body.appendChild(f);
        });
      }
      if (L.shade) {
        [['x', '影←→', 0, 100], ['y', '影↑↓', 0, 100], ['w', '影幅', 0, 60], ['h', '影高', 0, 20]]
          .forEach(([k, lbl, min, max]) => {
            const f = document.createElement('div');
            f.className = 'f';
            f.innerHTML =
              `<label>${lbl}</label>` +
              `<input type="range" min="${min}" max="${max}" step="0.5" value="${L.shade[k]}">` +
              `<input type="number" min="${min}" max="${max}" step="0.5" value="${L.shade[k]}">`;
            const [rng, num] = f.querySelectorAll('input');
            const set = (v) => {
              L.shade[k] = Math.round((+v || 0) * 10) / 10;
              rng.value = num.value = L.shade[k];
              repaint(L); persist();
            };
            rng.addEventListener('input', () => set(rng.value));
            num.addEventListener('input', () => set(num.value));
            body.appendChild(f);
          });
      }

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.innerHTML = 'ステージ上を <kbd>ドラッグ</kbd> で左右上下、' +
                       '<kbd>Shift</kbd>+ドラッグで拡大縮小';
      body.appendChild(hint);
      row.appendChild(body);

      head.addEventListener('click', (e) => {
        if (e.target.closest('.eye')) return;
        sel = sel === L.id ? null : L.id;
        buildList(); applyDim(); applyState();
      });
      head.querySelector('.eye').addEventListener('click', () => {
        const r = recFor(L.id), p = pinFor(L.id);
        const off = r.el.classList.toggle('hide');
        if (p) p.el.classList.toggle('hide', off);
        head.querySelector('.eye').classList.toggle('off', off);
      });

      listEl.appendChild(row);
    });
  }

  function applyDim() {
    const on = document.getElementById('dimBtn').classList.contains('on');
    recs.forEach(r => r.el.classList.toggle('dim', on && sel && r.def.id !== sel));
  }

  /* ---------- drag on the stage moves the selected layer ---------- */
  let drag = null;
  root.addEventListener('pointerdown', (e) => {
    if (!sel || e.target.closest('.hotspot')) return;
    const L = data.layers.find(l => l.id === sel);
    drag = { x: e.clientX, y: e.clientY, tx: L.tx, ty: L.ty, sx: L.sx, sy: L.sy, L, shift: e.shiftKey };
    root.setPointerCapture(e.pointerId);
  });
  root.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const stage = root.getBoundingClientRect();
    const dx = (e.clientX - drag.x) / stage.width * 100;
    const dy = (e.clientY - drag.y) / stage.height * 100;
    if (drag.shift) {
      const k = 1 + dx / 60;
      drag.L.sx = Math.max(.05, Math.round(drag.sx * k * 1000) / 1000);
      drag.L.sy = Math.max(.05, Math.round(drag.sy * k * 1000) / 1000);
    } else {
      drag.L.tx = Math.round((drag.tx + dx) * 10) / 10;
      drag.L.ty = Math.round((drag.ty + dy) * 10) / 10;
    }
    repaint(drag.L);
  });
  const endDrag = () => { if (drag) { buildList(); applyDim(); applyState(); persist(); drag = null; } };
  root.addEventListener('pointerup', endDrag);
  root.addEventListener('pointercancel', endDrag);

  /* ---------- arrow-key nudge ---------- */
  addEventListener('keydown', (e) => {
    if (!sel || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const L = data.layers.find(l => l.id === sel);
    const d = e.shiftKey ? 1 : 0.1;
    if (e.key === 'ArrowLeft') L.tx = +(L.tx - d).toFixed(1);
    else if (e.key === 'ArrowRight') L.tx = +(L.tx + d).toFixed(1);
    else if (e.key === 'ArrowUp') L.ty = +(L.ty - d).toFixed(1);
    else if (e.key === 'ArrowDown') L.ty = +(L.ty + d).toFixed(1);
    else return;
    e.preventDefault(); repaint(L); buildList(); applyDim(); applyState(); persist();
  });

  /* ---------- toolbar ---------- */
  const freezeBtn = document.getElementById('freeze');
  freezeBtn.addEventListener('click', () => {
    const on = freezeBtn.classList.toggle('on');
    motion.freeze(on);
    freezeBtn.textContent = on ? '静止' : '視差ON';
  });
  document.getElementById('guideBtn').addEventListener('click', (e) => {
    e.target.classList.toggle('on');
    guides.classList.toggle('off');
  });
  document.getElementById('dimBtn').addEventListener('click', (e) => {
    e.target.classList.toggle('on'); applyDim();
  });

  /* The room has a sleep state and an awake state, and props tagged `when` only
     appear in one of them. The tuner builds BOTH so either can be placed at any
     hour, and this cycles the preview so overlapping props can be judged apart.
     It only changes what is drawn — never the data. */
  const STATES = ['all', 'awake', 'sleep'];
  const STATE_LABEL = { all: '両方', awake: 'awake', sleep: 'sleep' };
  let stateIdx = 0;
  const stateBtn = document.getElementById('stateBtn');
  function applyState() {
    const st = STATES[stateIdx];
    stateBtn.textContent = '状態: ' + STATE_LABEL[st];
    stateBtn.classList.toggle('on', st !== 'all');
    recs.forEach(r => {
      const w = r.def.when;
      r.el.classList.toggle('state-off', !!w && st !== 'all' && w !== st);
    });
    listEl.querySelectorAll('.row').forEach(row => {
      const L = data.layers.find(l => l.id === row.dataset.id);
      row.classList.toggle('hidden-state', !!(L && L.when && st !== 'all' && L.when !== st));
    });
  }
  stateBtn.addEventListener('click', () => {
    stateIdx = (stateIdx + 1) % STATES.length;
    applyState();
  });

  const ta = document.getElementById('json');
  const serialise = () => JSON.stringify(data, null, 2);
  document.getElementById('copy').addEventListener('click', async () => {
    const t = serialise();
    try { await navigator.clipboard.writeText(t); note('コピーしました → layers.json に貼り付け'); }
    catch { ta.classList.add('show'); ta.value = t; ta.select(); note('手動でコピーしてください'); }
  });
  document.getElementById('show').addEventListener('click', () => {
    ta.classList.toggle('show'); ta.value = serialise();
  });
  document.getElementById('reset').addEventListener('click', () => {
    localStorage.removeItem(KEY);
    localStorage.removeItem(KEY + ':base');
    location.reload();
  });

  function persist() {
    localStorage.setItem(KEY, serialise());
    localStorage.setItem(KEY + ':base', freshText);
  }
  function note(t) { msg.textContent = t; clearTimeout(note.t); note.t = setTimeout(() => msg.textContent = '', 4000); }

  buildList();
  applyState();
  // the startup hint must not bury a warning about a discarded snapshot
  note(startupNote || 'レイヤー名をクリックして選択 → ドラッグ / 矢印キーで調整');
})();
</script>
</body>
</html>
